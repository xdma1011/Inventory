<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام جرد المطعم</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
        background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }

    .home {
        width: 100%;
        max-width: 1100px;
    }

    .home-header {
        text-align: center;
        color: #fff;
        margin-bottom: 40px;
    }

    .home-header h1 {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 0.5px;
    }

    .home-header p {
        margin-top: 10px;
        font-size: 14px;
        opacity: 0.7;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
    }

    .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        background: #f8f9fa;
        border-radius: 18px;
        padding: 40px 20px;
        text-decoration: none;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        border-top: 4px solid var(--accent);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 26px 60px rgba(0, 0, 0, 0.55);
    }

    .card .icon {
        font-size: 46px;
        line-height: 1;
    }

    .card h2 {
        font-size: 20px;
        font-weight: 900;
        color: #212121;
    }

    .card p {
        font-size: 12.5px;
        color: #607d8b;
        text-align: center;
    }

    .card-gardens { --accent: #2e7d32; }
    .card-marj    { --accent: #1565c0; }
    .card-transfer{ --accent: #00838f; }

    @media (max-width: 760px) {
        .cards { grid-template-columns: 1fr; }
        .home-header h1 { font-size: 24px; }
    }
</style>
</head>
<body>

<div class="home">
    <div class="home-header">
        <h1>نظام جرد المطعم</h1>
        <p>اختر الفرع أو الأداة التي تريد الدخول إليها</p>
    </div>

    <div class="cards">
        <a class="card card-gardens" href="gardens/index.html">
            <div class="icon">🌿</div>
            <h2>فرع الجاردنز</h2>
            <p>جرد ومتابعة مخزون فرع الجاردنز</p>
        </a>

        <a class="card card-marj" href="marj/index.html">
            <div class="icon">🏙️</div>
            <h2>فرع مرج الحمام</h2>
            <p>جرد ومتابعة مخزون فرع مرج الحمام</p>
        </a>

        <a class="card card-transfer" href="branch-transfer.html">
            <div class="icon">🔄</div>
            <h2>المنقولات بين الفروع</h2>
            <p>نقل المخزون بين الفروع</p>
        </a>
    </div>
</div>

</body>
</html>
