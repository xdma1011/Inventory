<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script>
    // بيانات الفرع — تُحمَّل قبل أي شيء
    window.BRANCH_ID   = 'central';
    window.BRANCH_NAME = 'المستودع المركزي';
    window.LS_KEY      = 'inventoryData_central_v1';
  </script>
  <script>document.write('<script src="data.js?v=' + Date.now() + '"><\/script>');</script>
  <script>
    // جلب الهيكل المشترك وحقنه بعد تحميل البيانات
    // دايماً آخر نسخة من الكود: القالب بلا كاش، وملفات shared بتنطلب برقم نسخة جديد كل فتحة
    const V = Date.now();
    fetch('../shared/template.html?v=' + V, { cache: 'no-store' })
      .then(r => r.text())
      .then(html => html.replace(/(\.\.\/shared\/[\w-]+\.(?:js|css))"/g, '$1?v=' + V + '"'))
      .then(html => { document.open(); document.write(html); document.close(); });
  </script>
</head>
<body><p style="font-family:sans-serif;padding:20px">جاري التحميل...</p></body>
</html>
